      <div id="shortcutMenuContent">
        <strong>Keyboard Shortcuts</strong>
        <ul>
          <li onclick="defaultBackground()">⌘ + ⌥ + 1: Default Background</li>
          <li onclick="setWhiteBackground()">⌘ + ⌥ + 2: White Background</li>
          <li onclick="setUserBackground()">⌘ + ⌥ + 3: User Background</li>
          <li onclick="toggleDock()">⌘ + ⌥ + 4: Toggle Dock</li>
          <li onclick="setsize()">⌘ + ⌥ + 5: Clear All Popups</li>
          <li onclick="shiftBackgroundLeft()">⌘ + ⌥ + 6: Shift Background Left</li>
          <li onclick="shiftBackgroundRight()">⌘ + ⌥ + 7: Shift Background Right</li>
